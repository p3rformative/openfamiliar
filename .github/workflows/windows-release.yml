# Manual Windows release workflow with signed updater artifacts.
#
# This file is inert until a maintainer sets the repository variable
# UPDATER_RELEASE_ENABLED=true and the TAURI_SIGNING_PRIVATE_KEY secret
# (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key uses one). It does not
# create git tags. A GitHub Release is created only when the workflow is
# dispatched with a vX.Y.Z tag input after it has been enabled, and only if
# that tag already exists. The build checks out that tag and refuses to
# continue if the app version does not match the tag without the leading v.
# See docs/guides/signed-updates.md.
#
# Adding or changing a workflow requires explicit maintainer authorization
# before merge.
#
# Do not put API tokens, private keys, or other secrets in this file.

name: windows-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z git tag to attach a GitHub Release to. Leave empty to build artifacts only, without creating a release or a tag.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  skipped-notice:
    if: ${{ vars.UPDATER_RELEASE_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Release publishing is not enabled
        run: |
          echo "This workflow is inert."
          echo "It does not build, sign, tag, or create a GitHub Release."
          echo "To enable it after the minisign key pair exists, follow docs/guides/signed-updates.md:"
          echo "  1. Commit the public key and updater endpoint in tauri.conf.json"
          echo "  2. Update the Signed updates section of PRIVACY.md"
          echo "  3. Add repository secret TAURI_SIGNING_PRIVATE_KEY (never commit it)"
          echo "  4. Optionally add TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "  5. Set repository variable UPDATER_RELEASE_ENABLED=true"
          echo "  6. A maintainer creates a vX.Y.Z tag themselves, then dispatches this workflow with that tag in the tag input"
          echo "OpenFamiliar does not claim that current binaries are signed."

  preflight:
    if: ${{ vars.UPDATER_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm the updater signing key is configured
        env:
          KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$KEY_PRESENT" != "true" ]; then
            echo "UPDATER_RELEASE_ENABLED is true, but TAURI_SIGNING_PRIVATE_KEY is not set."
            echo "No build, signing, or GitHub Release will be started. See docs/guides/signed-updates.md."
            exit 1
          fi
          echo "The updater signing key secret is present. The build job may run."

  build:
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Validate release tag
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Host "The tag input must match vX.Y.Z (digits only, for example v1.2.3). Got '$($env:RELEASE_TAG)'."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: meta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
              Write-Host "The tag input must match vX.Y.Z (digits only, for example v1.2.3). Got '$($env:RELEASE_TAG)'."
              exit 1
            }
            $version = $env:RELEASE_TAG
            $expected = $version.Substring(1)

            function Get-TauriAppVersion {
              $confPath = "apps/desktop/src-tauri/tauri.conf.json"
              if (-not (Test-Path -LiteralPath $confPath)) {
                throw "Missing $confPath"
              }
              $confDir = Split-Path -Parent $confPath
              $conf = Get-Content -LiteralPath $confPath -Raw | ConvertFrom-Json
              $raw = [string]$conf.version
              if ($raw) {
                $asPath = Join-Path $confDir $raw
                if (Test-Path -LiteralPath $asPath) {
                  $pkg = Get-Content -LiteralPath $asPath -Raw | ConvertFrom-Json
                  return [string]$pkg.version
                }
                return $raw
              }
              $cargoPath = "apps/desktop/src-tauri/Cargo.toml"
              $cargo = Get-Content -LiteralPath $cargoPath
              $usesWorkspace = $false
              $packageVersion = $null
              $inPackage = $false
              foreach ($line in $cargo) {
                if ($line -match '^\s*\[package\]\s*$') { $inPackage = $true; continue }
                if ($inPackage -and $line -match '^\s*\[') { break }
                if ($inPackage -and $line -match '^\s*version\.workspace\s*=\s*true\s*$') {
                  $usesWorkspace = $true
                }
                if ($inPackage -and $line -match '^\s*version\s*=\s*"([^"]+)"\s*$') {
                  $packageVersion = $Matches[1]
                }
              }
              if ($usesWorkspace) {
                $root = Get-Content -LiteralPath "Cargo.toml"
                $inWorkspacePackage = $false
                foreach ($line in $root) {
                  if ($line -match '^\s*\[workspace\.package\]\s*$') { $inWorkspacePackage = $true; continue }
                  if ($inWorkspacePackage -and $line -match '^\s*\[') { break }
                  if ($inWorkspacePackage -and $line -match '^\s*version\s*=\s*"([^"]+)"\s*$') {
                    return $Matches[1]
                  }
                }
                throw "Could not read workspace.package.version from Cargo.toml"
              }
              if ($packageVersion) { return $packageVersion }
              throw "Could not resolve the app version from tauri.conf.json or Cargo.toml"
            }

            $appVersion = Get-TauriAppVersion
            if ($appVersion -ne $expected) {
              Write-Host "The app version is '$appVersion' but the tag is '$version' (expected '$expected'). Refusing to build so a mismatched binary cannot offer a looping update."
              exit 1
            }
          } else {
            $version = "0.1.0"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >
          pnpm --filter @openfamiliar/desktop tauri build --config
          "{\"bundle\":{\"createUpdaterArtifacts\":true}}"

      - name: Hash installers
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle -Recurse -File -Include *.msi,*.exe,*.sig |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash, $_.Path } |
            Set-Content -Encoding utf8 target/release/bundle/SHA256SUMS.txt

      - name: Write latest.json
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_VERSION
          $base = "https://github.com/$env:REPO/releases/download/$version"
          ./scripts/release/Write-LatestJson.ps1 `
            -Version $version `
            -DownloadBaseUrl $base `
            -BundleRoot "target/release/bundle" `
            -OutputPath "target/release/bundle/latest.json"

      - name: Upload unsigned-or-signed workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openfamiliar-windows-release-${{ github.sha }}
          path: |
            target/release/bundle/msi/*
            target/release/bundle/nsis/*
            target/release/bundle/SHA256SUMS.txt
            target/release/bundle/latest.json
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The tag input must match vX.Y.Z (digits only, for example v1.2.3). Got '$RELEASE_TAG'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: openfamiliar-windows-release-${{ github.sha }}
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "OpenFamiliar Windows installers and minisign updater metadata for ${RELEASE_TAG}. This does not mean the installers are Authenticode- or SignPath-signed. See docs/guides/signed-updates.md." \
            --verify-tag \
            --repo "$REPO" \
            release-assets/latest.json \
            release-assets/SHA256SUMS.txt \
            release-assets/msi/* \
            release-assets/nsis/*
